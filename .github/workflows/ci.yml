name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type-check first for a fast, clearly-labelled failure before the
      # slower test and build steps. Uses `tsc -b` because the solution-style
      # tsconfig makes plain `tsc` a no-op (see issue #113).
      - name: Type check
        run: npx tsc -b

      - name: Run tests
        run: npm test

      # Production build gates the merge on a working Vite build. `npm run
      # build` also runs `tsc -b`, so a type regression fails here too.
      - name: Build
        run: npm run build
